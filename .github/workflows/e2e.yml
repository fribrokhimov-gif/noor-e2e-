name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          BASE_URL: https://tmerchant.noor.uz
          CORE_API_URL: https://core.test.api.noor.uz
          EMPLOYEES_API_URL: https://eats.test.api.noor.uz/api/v1
          X_PLATFORM: web
          MERCHANT_PHONE: ${{ secrets.MERCHANT_PHONE }}
          MERCHANT_PASSWORD: ${{ secrets.MERCHANT_PASSWORD }}
          RESET_OTP: ${{ secrets.RESET_OTP }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
